<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cầu Trường Rực Lửa - 2D Engine</title>
    <style>
        body { font-family: Tahoma, sans-serif; background-color: #2c3e50; color: #fff; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: #27ae60; padding: 10px; border-radius: 8px; border: 2px solid #fff; position: relative; }
        
        .scoreboard { background: #111; display: flex; justify-content: space-between; align-items: center; padding: 10px 20px; border-radius: 5px; margin-bottom: 10px; border: 2px solid #555; }
        .team-name { font-size: 20px; font-weight: bold; width: 30%; text-align: center; }
        .score-center { text-align: center; width: 40%; }
        .time { font-size: 14px; color: #aaa; margin-bottom: 5px; }
        .score { font-size: 28px; font-weight: bold; color: #f1c40f; }

        /* SÂN BÓNG 2D */
        #pitch { width: 100%; height: 350px; background: #4caf50; border: 3px solid #fff; position: relative; overflow: hidden; margin-bottom: 15px; border-radius: 5px; box-shadow: inset 0 0 20px rgba(0,0,0,0.3); }
        .center-line { position: absolute; left: 50%; top: 0; bottom: 0; width: 3px; background: #fff; transform: translateX(-50%); }
        .center-circle { position: absolute; left: 50%; top: 50%; width: 100px; height: 100px; border: 3px solid #fff; border-radius: 50%; transform: translate(-50%, -50%); }
        .penalty-box { position: absolute; top: 20%; bottom: 20%; width: 15%; border: 3px solid #fff; }
        .penalty-box.left { left: 0; border-left: none; }
        .penalty-box.right { right: 0; border-right: none; }

        /* CẦU THỦ & BÓNG */
        .dot { position: absolute; width: 24px; height: 24px; border-radius: 50%; text-align: center; line-height: 24px; font-size: 10px; font-weight: bold; color: white; border: 2px solid #fff; transition: all 1s ease-in-out; transform: translate(-50%, -50%); z-index: 2; }
        .dot.red { background: #e74c3c; } /* Đội nhà */
        .dot.blue { background: #2980b9; } /* Đội khách */
        .name-tag { position: absolute; top: -20px; left: 50%; transform: translateX(-50%); color: #fff; font-size: 11px; white-space: nowrap; text-shadow: 1px 1px 2px #000; }
        #ball { position: absolute; width: 16px; height: 16px; background: #fff; border-radius: 50%; border: 1px solid #000; transition: all 0.5s ease; transform: translate(-50%, -50%); z-index: 1; }

        /* POPUP (Nằm đè lên sân) */
        .action-popup { position: absolute; top: 10%; left: 50%; transform: translateX(-50%); width: 80%; background: rgba(120, 224, 143, 0.95); color: #000; border-radius: 8px; padding: 15px; display: flex; justify-content: space-between; align-items: center; border: 2px solid #2ecc71; box-shadow: 0 4px 10px rgba(0,0,0,0.5); z-index: 10; visibility: hidden; transition: opacity 0.3s; }
        .player-col { width: 30%; text-align: center; font-size: 13px; }
        .player-col strong { display: block; font-size: 15px; margin-bottom: 5px; }
        .action-center { width: 40%; text-align: center; }
        .action-title { font-weight: bold; font-size: 16px; margin-bottom: 10px; }
        .action-percent { font-size: 36px; font-weight: bold; color: #000; }

        #match-log { background: rgba(0,0,0,0.8); padding: 10px; border-radius: 5px; height: 100px; overflow-y: auto; font-size: 13px; }
        .text-green { color: #2ecc71; font-weight: bold; }
        .btn-play { display: block; width: 100%; padding: 15px; background: #e67e22; color: white; border: none; font-size: 18px; font-weight: bold; border-radius: 5px; cursor: pointer; margin-bottom: 15px; }
    </style>
</head>
<body>

    <button class="btn-play" onclick="startMatch()">BẮT ĐẦU TRẬN ĐẤU</button>

    <div class="container">
        <div class="scoreboard">
            <div class="team-name" id="ui-home-name">Nantes</div>
            <div class="score-center">
                <div class="time" id="ui-time">00:00</div>
                <div class="score"><span id="ui-home-score">0</span> : <span id="ui-away-score">0</span></div>
            </div>
            <div class="team-name" id="ui-away-name">Genk.vn</div>
        </div>

        <div id="pitch">
            <div class="center-line"></div>
            <div class="center-circle"></div>
            <div class="penalty-box left"></div>
            <div class="penalty-box right"></div>

            <div class="dot red" id="ui-atk"><span class="name-tag" id="name-atk"></span>10</div>
            <div class="dot blue" id="ui-def"><span class="name-tag" id="name-def"></span>4</div>
            <div class="dot blue" id="ui-gk"><span class="name-tag" id="name-gk"></span>1</div>
            <div id="ball"></div>

            <div class="action-popup" id="ui-action-popup"></div>
        </div>

        <div id="match-log"></div>
    </div>

    <script src="main.js"></script>
</body>
</html>
