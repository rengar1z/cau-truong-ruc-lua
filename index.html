<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Web Football Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <div id="scoreboard">
            <div class="team">
                <h3>Đội Nhà (Đỏ)</h3>
                <span id="score-home">0</span>
            </div>
            <div class="timer">
                <span id="match-time">00:00</span>
            </div>
            <div class="team">
                <span id="score-away">0</span>
                <h3>Đội Khách (Xanh)</h3>
            </div>
        </div>

        <div id="event-screen">
            <h2 id="event-title">Chuẩn bị thi đấu</h2>
            <div id="duel-arena">
                <div class="player-card attacker" id="attacker-card">
                    <h4 id="atk-name">Tiền đạo</h4>
                    <p id="atk-stat-desc">Chỉ số: <span id="atk-stat">0</span></p>
                    <div class="awaken-fx" id="atk-awaken">THỨC TỈNH!</div>
                </div>
                
                <div class="win-chance">
                    <p>Cơ hội</p>
                    <h1 id="win-prob">--%</h1>
                </div>

                <div class="player-card defender" id="defender-card">
                    <h4 id="def-name">Hậu vệ/Thủ môn</h4>
                    <p id="def-stat-desc">Chỉ số: <span id="def-stat">0</span></p>
                    <div class="awaken-fx" id="def-awaken">THỨC TỈNH!</div>
                </div>
            </div>
            
            <div id="commentary-box">
                Đang kết nối tới máy chủ trận đấu...
            </div>
        </div>

        <button id="btn-start" disabled>Đang tải dữ liệu Firebase...</button>
    </div>
    
    <script type="module" src="game.js"></script>
</body>
</html>
