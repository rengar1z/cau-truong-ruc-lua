<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cầu Trường Rực Lửa - Match Engine</title>
    <style>
        body { font-family: Tahoma, sans-serif; background-color: #2c3e50; color: #fff; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: #34495e; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .header { text-align: center; margin-bottom: 20px; color: #f1c40f; }
        .btn-play { display: block; width: 100%; padding: 15px; background: #e74c3c; color: white; border: none; font-size: 18px; font-weight: bold; border-radius: 5px; cursor: pointer; transition: 0.3s; }
        .btn-play:hover { background: #c0392b; }
        
        #match-log { margin-top: 20px; background: #1a252f; padding: 15px; border-radius: 5px; min-height: 200px; font-size: 15px; line-height: 1.6; border-left: 4px solid #2ecc71; }
        .text-blue { color: #3498db; } /* Đội nhà */
        .text-red { color: #e74c3c; } /* Đội khách */
        .text-green { color: #2ecc71; font-weight: bold; } /* Bàn thắng */
        .text-yellow { color: #f1c40f; } /* Hành động */
    </style>
</head>
<body>

    <div class="container">
        <h2 class="header">⚽ Mô phỏng Trận đấu (Match Engine)</h2>
        <button class="btn-play" onclick="startMatch()">BẤM ĐỂ ĐÁ!</button>
        
        <div id="match-log">
            <i>Bình luận viên đang chờ trận đấu bắt đầu...</i>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
