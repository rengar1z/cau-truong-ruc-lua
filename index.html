<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cầu Trường Rực Lửa - Classic Engine</title>
    <style>
        body { font-family: Tahoma, sans-serif; background-color: #2c3e50; color: #fff; padding: 20px; }
        .container { max-width: 700px; margin: 0 auto; background: #27ae60; padding: 15px; border-radius: 8px; border: 2px solid #fff; }
        
        /* Bảng tỷ số */
        .scoreboard { background: #111; display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; border-radius: 5px; margin-bottom: 5px; border: 2px solid #555; }
        .team-name { font-size: 20px; font-weight: bold; width: 30%; text-align: center; }
        .score-center { text-align: center; width: 40%; }
        .time { font-size: 14px; color: #aaa; margin-bottom: 5px; }
        .score { font-size: 28px; font-weight: bold; color: #f1c40f; }

        /* Thanh Tinh thần thi đấu */
        .morale-container { display: flex; justify-content: space-between; background: #000; padding: 2px; margin-bottom: 15px; font-size: 12px; text-align: center; border: 1px solid #333; }
        .morale-bar { padding: 3px 0; color: white; width: 50%; font-weight: bold; }
        .morale-red { background: #c0392b; border-right: 1px solid #000; }
        .morale-blue { background: #2980b9; }

        /* Popup Tình huống (Giống hệt ảnh) */
        .action-popup { background: #78e08f; color: #000; border-radius: 8px; padding: 15px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; border: 2px solid #2ecc71; box-shadow: 0 4px 6px rgba(0,0,0,0.3); min-height: 120px; transition: opacity 0.3s; }
        .player-col { width: 30%; text-align: center; font-size: 13px; }
        .player-col strong { display: block; font-size: 16px; margin-bottom: 5px; color: #d35400; }
        .action-center { width: 40%; text-align: center; }
        .action-title { font-weight: bold; font-size: 16px; margin-bottom: 10px; }
        .action-percent { font-size: 36px; font-weight: bold; color: #000; }

        /* Khung bình luận */
        #match-log { background: rgba(0,0,0,0.8); padding: 15px; border-radius: 5px; height: 250px; overflow-y: auto; font-size: 15px; line-height: 1.6; border-left: 4px solid #2ecc71; }
        .text-blue { color: #3498db; font-weight: bold;} .text-red { color: #e74c3c; font-weight: bold; } .text-green { color: #2ecc71; font-weight: bold; font-size: 16px;} .text-yellow { color: #f1c40f; }
        
        .btn-play { display: block; width: 100%; padding: 15px; background: #e67e22; color: white; border: none; font-size: 18px; font-weight: bold; border-radius: 5px; cursor: pointer; margin-bottom: 15px; }
        .btn-play:disabled { background: #7f8c8d; cursor: not-allowed; }
    </style>
</head>
<body>

    <button class="btn-play" id="btn-start" onclick="startMatch()">BẮT ĐẦU TRẬN ĐẤU</button>

    <div class="container">
        <div class="scoreboard">
            <div class="team-name" id="ui-home-name">Nantes</div>
            <div class="score-center">
                <div class="time" id="ui-time">00:00</div>
                <div class="score"><span id="ui-home-score">0</span> - <span id="ui-away-score">0</span></div>
            </div>
            <div class="team-name" id="ui-away-name">Genk.vn</div>
        </div>

        <div class="morale-container">
            <div class="morale-bar morale-red" id="ui-home-morale">Tinh thần thi đấu: 338</div>
            <div class="morale-bar morale-blue" id="ui-away-morale">Tinh thần thi đấu: 498</div>
        </div>

        <div class="action-popup" id="ui-action-popup" style="visibility: hidden;">
            </div>

        <div id="match-log">
            <i>Khán đài đã chật kín, chờ tiếng còi khai cuộc...</i>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
